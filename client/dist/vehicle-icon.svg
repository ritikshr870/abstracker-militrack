<svg xmlns="http://www.svg.org/2000/svg" viewBox="0 0 100 100" width="40" height="40">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3" />
    </filter>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="carGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>
  
  <g filter="url(#shadow)">
    <!-- Car Body -->
    <rect x="25" y="10" width="50" height="80" rx="15" fill="url(#carBody)" />
    
    <!-- Windshield -->
    <path d="M 30 35 L 70 35 L 65 25 L 35 25 Z" fill="url(#carGlass)" />
    
    <!-- Rear Window -->
    <path d="M 32 65 L 68 65 L 65 72 L 35 72 Z" fill="url(#carGlass)" />
    
    <!-- Headlights -->
    <ellipse cx="32" cy="12" rx="4" ry="2" fill="#fef08a" />
    <ellipse cx="68" cy="12" rx="4" ry="2" fill="#fef08a" />
    
    <!-- Taillights -->
    <ellipse cx="32" cy="88" rx="4" ry="2" fill="#fca5a5" />
    <ellipse cx="68" cy="88" rx="4" ry="2" fill="#fca5a5" />

    <!-- Side Mirrors -->
    <path d="M 25 35 Q 20 35 23 40 Z" fill="#b91c1c" />
    <path d="M 75 35 Q 80 35 77 40 Z" fill="#b91c1c" />
  </g>
</svg>
